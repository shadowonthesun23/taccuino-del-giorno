name: Build autumn seasonal artworks

on:
  push:
    branches:
      - feat/autumn-seasonal-artworks
    paths:
      - scripts/build-autumn-artworks.mjs
      - scripts/add-autumn-full-preview.mjs
      - .github/workflows/build-autumn-artworks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autumn-seasonal-artworks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-autumn-artworks.mjs
      - run: node scripts/add-autumn-full-preview.mjs
      - name: Commit generated autumn preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/seasonal/*.webp lib/seasonal-artwork.ts
          if git diff --cached --quiet; then
            echo "No generated preview changes"
            exit 0
          fi
          git commit -m "feat: add full autumn review preview"
          git push origin HEAD:feat/autumn-seasonal-artworks
